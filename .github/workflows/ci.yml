name: Validate Sentinel AI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'desktop/**'
      - 'eng/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'server/**'
      - 'Directory.*'
      - '*.sln'
      - 'global.json'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'desktop/**'
      - 'eng/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'server/**'
      - 'Directory.*'
      - '*.sln'
      - 'global.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./scripts/audit-nuget.ps1
      - name: Build and test application
        shell: pwsh
        run: ./scripts/build-user.ps1 -Installer -AllowDownloads
      - name: Verify Electron Windows autostart in isolated runner
        shell: pwsh
        working-directory: desktop
        env:
          SENTINEL_TEST_ALLOW_LOGIN_ITEM_MUTATION: '1'
        run: |
          & .\node_modules\.bin\electron.cmd ..\scripts\test-electron-autostart.cjs
          if ($LASTEXITCODE) { throw 'Electron Windows autostart integration test failed' }
      - name: Run isolated headless browser-extension E2E
        shell: pwsh
        run: |
          node scripts/test-chrome-extension-e2e.cjs chrome --allow-headless-browser --allow-local-download-fixtures
          if ($LASTEXITCODE) { throw 'Chrome extension E2E failed' }
          node scripts/test-chrome-extension-e2e.cjs edge --allow-headless-browser --allow-local-download-fixtures
          if ($LASTEXITCODE) { throw 'Edge extension E2E failed' }
      - name: Run isolated installer install-verify-uninstall integration test
        shell: pwsh
        run: |
          $version = ([xml](Get-Content eng/ProductVersion.props -Raw)).Project.PropertyGroup.VersionPrefix
          if (!$version) { throw 'Could not read the installer version.' }
          $installer = Join-Path $PWD "artifacts/desktop/Sentinel.AI.Setup.$version.exe"
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Built installer was not found.' }
          $repoRoot = $PWD.Path
          $test = Start-Process -FilePath $installer -ArgumentList @('--integration-test', "--browser-e2e-repo=$repoRoot") -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'Sentinel AI/Logs/installer.log'
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              Get-Content -LiteralPath $log -Tail 80 | Select-String 'INTEGRATION_TEST_|BROWSER_E2E|Native Messaging'
            }
            throw "Isolated installer integration test failed with exit code $($test.ExitCode)."
          }
      - name: Run visible installer wizard install-repair-uninstall integration test
        shell: pwsh
        run: |
          $version = ([xml](Get-Content eng/ProductVersion.props -Raw)).Project.PropertyGroup.VersionPrefix
          if (!$version) { throw 'Could not read the installer version.' }
          $installer = Join-Path $PWD "artifacts/desktop/Sentinel.AI.Setup.$version.exe"
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Built installer was not found.' }
          $test = Start-Process -FilePath $installer -ArgumentList @('--wizard-integration-test') -PassThru
          if (!$test.WaitForExit(660000)) {
            Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
            throw 'Visible installer wizard integration test exceeded its 11-minute CI limit.'
          }
          if ($test.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'Sentinel AI/Logs/installer.log'
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              Get-Content -LiteralPath $log -Tail 80 | Select-String 'WIZARD_INTEGRATION_TEST|UI_INSTALL_|INSTALL_VERIFIED|UNINSTALL_'
            }
            throw "Visible installer wizard integration test failed with exit code $($test.ExitCode)."
          }
      - name: Build and test Enterprise API
        shell: pwsh
        run: |
          dotnet test server/Sentinel.Server.sln -c Release
          if ($LASTEXITCODE) { throw 'Enterprise API tests failed' }
          dotnet build server/Sentinel.Server.sln -c Release --no-restore
          if ($LASTEXITCODE) { throw 'Enterprise API build failed' }
          python server/scripts/test-api.py
          if ($LASTEXITCODE) { throw 'Enterprise API HTTP smoke test failed' }
