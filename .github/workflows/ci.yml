name: Validate Sentinel AI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'desktop/**'
      - 'eng/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'server/**'
      - 'Directory.*'
      - '*.sln'
      - 'global.json'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'desktop/**'
      - 'eng/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'server/**'
      - 'Directory.*'
      - '*.sln'
      - 'global.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test application
        shell: pwsh
        run: ./scripts/build-user.ps1
      - name: Build and test Enterprise API
        shell: pwsh
        run: |
          dotnet test server/Sentinel.Server.sln -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE) { throw 'Enterprise API tests failed' }
          dotnet build server/Sentinel.Server.sln -c Release --no-restore
          if ($LASTEXITCODE) { throw 'Enterprise API build failed' }
          python server/scripts/test-api.py
          if ($LASTEXITCODE) { throw 'Enterprise API HTTP smoke test failed' }
