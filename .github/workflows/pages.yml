name: Deploy public website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'eng/ProductVersion.props'
      - 'artifacts/installer/**'
      - 'scripts/build-pages.py'
      - 'server/src/Sentinel.Server.Api/wwwroot/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enable GitHub Pages for Actions deployments
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static website and include the current installer
        run: python3 scripts/build-pages.py _site
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
