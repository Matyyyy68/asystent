name: Build and publish Sentinel website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'website/**'
      - 'media/**'
      - 'scripts/copy-media.mjs'
      - 'scripts/check-public-release.mjs'
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - run: npm ci
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - run: npm run check:live
        working-directory: website
        env:
          SENTINEL_LIVE_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
