name: Build and publish Sentinel AI installer
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-user.ps1 -Installer -AllowDownloads
      - name: Verify the installer payload
        shell: pwsh
        run: |
          $version = ([xml](Get-Content eng/ProductVersion.props)).Project.PropertyGroup.VersionPrefix
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match product version $version" }
          $installer = "artifacts/desktop/Sentinel.AI.Setup.$version.exe"
          if (!(Test-Path $installer)) { throw "Missing installer: $installer" }
          & $installer --self-test
          if ($LASTEXITCODE) { throw 'Installer self-test failed' }
      - name: Test install, update and uninstall on the release artifact
        shell: pwsh
        run: |
          $version = ([xml](Get-Content eng/ProductVersion.props -Raw)).Project.PropertyGroup.VersionPrefix
          $installer = Join-Path $PWD "artifacts/desktop/Sentinel.AI.Setup.$version.exe"
          $test = Start-Process -FilePath $installer -ArgumentList @('--integration-test') -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw "Release artifact integration test failed with exit code $($test.ExitCode)." }
      - name: Test visible installer wizard on the release artifact
        shell: pwsh
        run: |
          $version = ([xml](Get-Content eng/ProductVersion.props -Raw)).Project.PropertyGroup.VersionPrefix
          $installer = Join-Path $PWD "artifacts/desktop/Sentinel.AI.Setup.$version.exe"
          $test = Start-Process -FilePath $installer -ArgumentList @('--wizard-integration-test') -PassThru
          if (!$test.WaitForExit(660000)) {
            Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
            throw 'Release artifact wizard integration test exceeded its 11-minute limit.'
          }
          if ($test.ExitCode -ne 0) { throw "Release artifact wizard integration test failed with exit code $($test.ExitCode)." }
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content eng/ProductVersion.props)).Project.PropertyGroup.VersionPrefix
          $installer = "artifacts/desktop/Sentinel.AI.Setup.$version.exe"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @'
          Poprawka kreatora instalacji: sprawdzanie lokalizacji i miejsca działa w tle, a powtórne kliknięcia nie uruchamiają równoległych etapów.

          Przed publikacją assety przeszły self-test oraz izolowane testy instalacji, aktualizacji, weryfikacji, deinstalacji i widocznego kreatora na runnerze Windows.

          Wydanie testowe. Instalator nie jest podpisany certyfikatem Authenticode.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sha256" --verify-tag --prerelease --title "Sentinel AI $version" --notes-file $notes
